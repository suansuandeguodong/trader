# ── EMA20 拐头反转 · 量化实盘交易配置 ──

# ============ 账户与网络 ============
proxy: "http://127.0.0.1:10808"       # 本地代理（币安访问必需）
testnet: false                         # false = 真实合约，true = 测试网

# ============ 选币池 ============
min_volume_usdt: 18000000              # 24h 成交额下限（USDT）

# ============ 信号参数 ============
signal_interval: "5m"                  # 信号 K 线周期："15m" / "5m"（切换周期会自动同步 EMA、共振、收盘对齐）
ema_period: 20                         # EMA 周期
min_down_bars: 13                      # 向上拐头前需连续不涨最少根数
min_up_bars: 13                        # 向下拐头前需连续不跌最少根数
min_body_pct: 1.0                      # 拐头 K 线实体涨/跌幅下限（%）
max_body_pct: 3.0                     # 拐头 K 线实体涨/跌幅上限（%），超过则不交易（止损幅度过大）

# ============ 数据/计算 ============
window_size: 300                       # 滑动窗口长度（根）
warmup_limit: 500                      # 预热拉取历史 K 线数
max_workers: 20                        # 并发线程数（实测并发20无问题，偶发慢请求靠 timeout 兜底即可）
batch_size: 25                         # 每批拉取币数
batch_interval: 1.5                    # 批间间隔（秒）
rescan_interval: 14400                 # 候选池刷新间隔（秒）
lead_seconds: 15                       # 15m K 线收盘前提前触发秒数

# ============ 交易规则 ============
order_notional_usdt: 30.0              # 每笔名义仓位（USDT）
risk_reward_ratio: 2.0                 # 盈亏比（止损:止盈 = 2:1，即亏2赚1）
max_positions: 7                       # 最大同时持仓数
cancel_timeout_sec: 900                # 开仓限价单未成交撤单时间（秒）= 15 分钟
leverage: 50                           # 杠杆倍数（50x）

# ============ 策略模式 ============
# resonance = 拐头 + EMA10/20 共振确认立即开仓（初始套出场：止损=信号开盘、止盈=入场±幅度一半）
# pullback  = 3m 回调入场（止损=信号最低价/min前开盘，止盈=成交价±信号实体一半）
strategy_mode: "resonance"

# ============ 3m 回调入场 ============
enable_pullback: true                  # 开关：15m拐头后等3m回调到EMA15再入场（false则退回原"信号即挂单"）
pullback_ema_period: 15                # 3m 的 EMA 周期
pullback_warmup: 300                   # 3m 预热拉取历史 K 线数
pullback_window: 300                   # 3m 滑动窗口长度
pullback_watch_seconds: 1800           # 观察期时长（秒）= 30 分钟，超时未回调则放弃信号
pullback_check_every: 15               # 3m 监控轮询间隔（秒）
